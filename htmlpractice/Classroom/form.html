<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Welcome</h1>

    <form >
        
        <label for="name">Name</label> <br>   <!--br for another line-->
        <input id="name" type="text" placeholder="Enter your name" name="name" required > <br>

        <label for="email">Email</label> <br>
        <input id="email" type="email" palceholder="Enter your email" name="email"> <br>

        <label for="pass">Password</label> <br>
        <input id="pass" type="password"> <br>

        <label for="phone">Phone no.</label><br>
        <input id="phone" type="tel" name="phone">

        <label>Date</label>
        <input type="date" name="date">
        <br>
        <br>

        <label>Skill:</label>
        <select name="skill">"
            <option value="html">Html</option>
            <option value="css">CSS</option>
            <option value="js">JS</option>
        </select>


        <section>
            <input id="html" type="checkbox">
            <label for="html" >html</label>
            <input id="css" type="checkbox">
            <label for="css" >css</label>
            <input id="js" type="checkbox">
            <label for="js" >js</label>
        </section>

        <section>
            <label>Gender:</label>
            <input type="radio" name="gender">
            <label >Male</label>
            <input type="radio" name="gender">
            <label >Female</label>
            <input type="radio" name="gender">
            <label >Other</label>
            
        </section>

        <input type="file" name="file">
        <input type="range" max="3" min="0">
        <input type="submit">
        <input type="">


        <br>
        <br>

        <button type="submit"> Submit</button>

        <iframe src="./" width="600" height="400"></iframe>

    </form>

</body>
</html>
