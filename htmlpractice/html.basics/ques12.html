<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Creative Formatting</title>
</head>
<body>
    <!-- Creative paragraph using multiple inline elements -->
    <p>
        <strong>Dream big!</strong>
        <em>Keep learning</em> and
        <mark>Never give up</mark>.
        <br>
        <small>Every small step takes you closer to your goal.</small>
    </p>
</body>
</html>
