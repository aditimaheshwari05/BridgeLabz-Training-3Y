<!DOCTYPE html>
<html>
<head>
    <title>Google Map</title>
</head>
<body>

    <h2>My City Location</h2>

    <!-- loading="lazy" loads the map only when it is about to become visible on the screen -->
    <iframe
        src="https://www.google.com/maps?q=Agra%2C%20India&output=embed"
        title="Google Map showing Agra, India"
        width="600"
        height="450"
        loading="lazy">
    </iframe>

</body>
</html>
