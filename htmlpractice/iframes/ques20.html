<!DOCTYPE html>
<html>
<head>

    <!-- <title> sets the title displayed in the browser tab -->
    <title>Important Head Elements</title>

    <!-- <meta charset> defines the character encoding of the webpage -->
    <meta charset="UTF-8">

    <!-- <meta description> provides a short description of the webpage -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- <meta author> specifies the author of the webpage -->
    <meta name="author" content="Aditi">

    <!-- <base> sets the base URL for relative links in the webpage -->
    <base href="https://example.com/">

    <!-- <link> connects the HTML document to an external resource such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- <style> is used to add CSS styles to the webpage -->
    <style>
        /* CSS can be written here */
    </style>

    <!-- <script> is used to add JavaScript to the webpage -->
    <script>
        // JavaScript can be written here
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>
    <p>This page demonstrates the important elements used inside the &lt;head&gt; section.</p>

</body>
</html>
