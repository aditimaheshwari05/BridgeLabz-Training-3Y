<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <style>
        body { font-family: Arial; padding: 20px; }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            cursor: pointer;
        }

        #modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        #modal img {
            max-width: 80%;
            max-height: 80%;
        }
    </style>
</head>
<body>

    <h2>Image Gallery</h2>

    <div class="gallery" id="gallery">
        <img src="https://picsum.photos/id/10/400/300">
        <img src="https://picsum.photos/id/20/400/300">
        <img src="https://picsum.photos/id/30/400/300">
        <img src="https://picsum.photos/id/40/400/300">
        <img src="https://picsum.photos/id/50/400/300">
        <img src="https://picsum.photos/id/60/400/300">
    </div>

    <div id="modal">
        <img id="modalImage" src="" alt="Preview">
    </div>

    <script src="question5.js" defer></script>
</body>
</html>
